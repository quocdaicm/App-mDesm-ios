name: Auto unzip

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén các file zip ở thư mục gốc
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Giải nén $z"
            unzip -oq "$z"
            rm -f "$z"
          done

      - name: Commit kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
          else
            git commit -m "Auto unzip"
            git push
          fi
